name: auth-service.yml
on:
  push:
    paths:
      - auth-service/**
    branches:
      - 'main'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      working-directory: ./auth-service
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/order-service
    defaults:
      run:
        working-directory: ${{env.working-directory}}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Format code
        run: ./mvnw -ntp spotless:apply

      - name: Build
        run: ./mvnw -ntp verify -DskipTests

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Build and Publish Docker Image
        run: |
          ./mvnw spring-boot:build-image -DskipTests
          echo "Pushing the image prasannakumar22/biglibrary-auth-service:latest to Docker Hub..."
          docker push prasannakumar22/biglibrary-auth-service:latest


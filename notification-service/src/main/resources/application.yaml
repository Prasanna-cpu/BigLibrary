spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:35432/notificationDB?TimeZone=UTC
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:PLACEHOLDER}
    password: ${MAIL_PASSWORD:PLACEHOLDER}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8083
  shutdown: graceful

management:
  info:
    git:
      mode: full
  endpoints:
    web:
      exposure:
        include: "*"



notifications:
  order-events-exchange: orders-exchange
  new-orders-queue: new-orders
  delivered-orders-queue: delivered-orders
  cancelled-orders-queue: cancelled-orders
  error-orders-queue: error-orders
  support-email: "kumar@gmail.com"
#  catalog-service-url: http://localhost:8081


resilience4j:
  retry:
    backends:
      catalog-service:
        max-attempts: 5
        wait-duration:
          seconds: 1

  circuitbreaker:
    backends:
      catalog-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 5
        wait-duration-in-open-state:
          seconds: 20
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50



